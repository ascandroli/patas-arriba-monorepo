<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0F0F0F" />
  <title>Patas Arriba — MUI Dark Mockup v3</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/@mui/material@5.17.1/umd/material-ui.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', -apple-system, sans-serif; background: #0F0F0F; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
    #root { min-height: 100dvh; }
    .MuiBottomNavigation-root .Mui-selected { color: #FF6B35 !important; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const {
      ThemeProvider, createTheme, styled,
      CssBaseline,
      Box, Container, Paper, Typography, Button, IconButton, TextField, Stack,
      Card, CardContent, CardHeader, CardActions, CardActionArea,
      Chip, Avatar, Alert, Divider, Switch, FormControlLabel,
      List, ListItem, ListItemText, ListItemAvatar, ListItemButton, ListItemIcon,
      AppBar, Toolbar, BottomNavigation, BottomNavigationAction, Fab,
      Collapse, Accordion, AccordionSummary, AccordionDetails,
      Drawer, SwipeableDrawer,
      Select, MenuItem, InputLabel, FormControl, InputAdornment,
      Tab, Tabs, Badge, Tooltip, ToggleButton, ToggleButtonGroup,
    } = MaterialUI;
    const { useState, useEffect, useCallback, useMemo, createContext, useContext } = React;

    // ============================================================
    // THEME
    // ============================================================
    const theme = createTheme({
      palette: {
        mode: 'dark',
        primary: { main: '#FF6B35', light: '#FF8F65', dark: '#CC5529', contrastText: '#fff' },
        secondary: { main: '#4ECDC4', light: '#7EDBD5', dark: '#3EA39C' },
        error: { main: '#EF4444' },
        warning: { main: '#FBBF24' },
        success: { main: '#34D399' },
        info: { main: '#60A5FA' },
        background: { default: '#0F0F0F', paper: '#1A1A1A' },
        text: { primary: '#F5F5F5', secondary: '#A0A0A0' },
        divider: '#2E2E2E',
      },
      typography: {
        fontFamily: "'Inter', -apple-system, sans-serif",
        h1: { fontSize: 'clamp(1.5rem, 5vw, 1.75rem)', fontWeight: 800, letterSpacing: '-0.5px' },
        h2: { fontSize: 'clamp(1.3rem, 4vw, 1.5rem)', fontWeight: 700, letterSpacing: '-0.3px' },
        h3: { fontSize: '1.1rem', fontWeight: 700 },
        h4: { fontSize: '1rem', fontWeight: 700 },
        h5: { fontSize: '0.95rem', fontWeight: 600 },
        h6: { fontSize: '0.875rem', fontWeight: 600 },
        body1: { fontSize: '0.875rem' },
        body2: { fontSize: '0.8125rem' },
        caption: { fontSize: '0.6875rem' },
        button: { textTransform: 'none', fontWeight: 600 },
      },
      shape: { borderRadius: 12 },
      components: {
        MuiButton: { styleOverrides: { root: { minHeight: 48, borderRadius: 10, padding: '12px 20px' } } },
        MuiIconButton: { styleOverrides: { root: { minWidth: 44, minHeight: 44 } } },
        MuiCard: { styleOverrides: { root: { borderRadius: 16, backgroundImage: 'none' } } },
        MuiFab: { styleOverrides: { root: { textTransform: 'none', fontWeight: 600 } } },
        MuiChip: { styleOverrides: { root: { fontWeight: 600, borderRadius: 20 } } },
        MuiTextField: { styleOverrides: { root: { '& .MuiOutlinedInput-root': { borderRadius: 10 } } } },
        MuiAccordion: { styleOverrides: { root: { backgroundImage: 'none', '&:before': { display: 'none' } } } },
        MuiBottomNavigationAction: { styleOverrides: { root: { minWidth: 0, '&.Mui-selected': { color: '#FF6B35' } } } },
      },
    });

    // ============================================================
    // DATA
    // ============================================================
    const USERS = [
      { _id:'u1', username:'maria_v', name:'Maria V.', role:'admin', color:'#FF6B35', initials:'MV', phone:'+34 612 345 678', since:'Jun 2024' },
      { _id:'u2', username:'carlos_r', name:'Carlos R.', role:'organizer', color:'#4ECDC4', initials:'CR', phone:'+34 623 456 789', since:'Ago 2024' },
      { _id:'u3', username:'lucia_m', name:'Lucia M.', role:'user', color:'#A78BFA', initials:'LM', phone:'+34 634 567 890', since:'Oct 2024' },
      { _id:'u4', username:'pablo_g', name:'Pablo G.', role:'user', color:'#F472B6', initials:'PG', phone:'+34 645 678 901', since:'Ene 2025' },
      { _id:'u5', username:'ana_s', name:'Ana S.', role:'user', color:'#34D399', initials:'AS', phone:'+34 656 789 012', since:'Feb 2025' },
      { _id:'u6', username:'nuevo_user', name:'Pedro L.', role:'pending', color:'#6B7280', initials:'PL', phone:'+34 667 890 123', since:'Mar 2025' },
    ];
    const EVENTS = [
      { _id:'e1', title:'Visita a la Protectora', cat:'protectora', loc:'Protectora Municipal, C/ Esperanza 12', date:'2026-04-05T10:00:00', status:'open', owner:USERS[1], attendees:5, hasCars:true, hasTasks:true, desc:'Jornada de voluntariado en la protectora. Necesitamos ayuda para pasear a los perros y limpiar las instalaciones. Traer ropa comoda.' },
      { _id:'e2', title:'Mercadillo Solidario', cat:'mercadillo', loc:'Plaza Mayor, Centro', date:'2026-04-12T09:00:00', status:'open', owner:USERS[0], attendees:3, hasCars:true, hasTasks:false, desc:'Mercadillo para recaudar fondos. Voluntarios para montar puestos desde las 8am.' },
      { _id:'e3', title:'Recogida de Alimentos', cat:'recogida', loc:'Supermercado Gran Via', date:'2026-03-20T11:00:00', status:'closed', owner:USERS[1], attendees:4, hasCars:false, hasTasks:true, desc:'Recogida de pienso y alimentos donados.' },
    ];
    const CAR_GROUPS = [
      { _id:'cg1', owner:USERS[1], brand:'Seat Leon', color:'Blanco', seats:4, taken:1, pickup:'Estacion de tren, Puerta Norte', time:'09:30' },
      { _id:'cg2', owner:USERS[3], brand:'Renault Clio', color:'Azul', seats:3, taken:0, pickup:'Plaza del Ayuntamiento', time:'09:15' },
    ];
    const MESSAGES = [
      { _id:'m1', user:USERS[1], text:'Recordad traer agua y gorra, hara calor!', time:'18:30', mine:false },
      { _id:'m2', user:USERS[2], text:'Yo llevo bolsas extra por si acaso', time:'19:15', mine:false },
      { _id:'m3', user:USERS[0], text:'Perfecto! Nos vemos alli', time:'20:00', mine:true },
    ];
    const GLOSSARY = [
      { term:'Evento', def:'Actividad organizada por la fundacion donde los voluntarios participan.' },
      { term:'Grupo de coche', def:'Un voluntario ofrece plazas en su coche para llevar a otros al evento.' },
      { term:'Organizador', def:'Voluntario con permisos para crear eventos y gestionar participantes.' },
      { term:'Protectora', def:'Visita a un refugio o protectora de animales.' },
      { term:'Recogida', def:'Recogida de alimentos, material o donaciones.' },
      { term:'Mercadillo', def:'Mercadillo solidario para recaudar fondos.' },
    ];

    const CAT_COLORS = { protectora:'#FF6B35', mercadillo:'#4ECDC4', recogida:'#FBBF24', otro:'#666' };
    const CAT_ICONS = { protectora:'pets', mercadillo:'storefront', recogida:'inventory_2', otro:'event' };
    function MIcon({name, sx, ...p}) { return <span className="material-icons-round" style={{fontSize:20,...sx}} {...p}>{name}</span>; }
    function fmtDate(d) { return new Date(d).toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'}); }
    function fmtTime(d) { return new Date(d).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}); }
    function isPast(d) { const e=new Date(d);e.setHours(0,0,0,0);const t=new Date();t.setHours(0,0,0,0);return e<t; }
    function isToday(d) { return new Date(d).toDateString()===new Date().toDateString(); }
    function timeLabel(d) { return isToday(d)?'Hoy':isPast(d)?'Pasado':'Proximo'; }
    function UserAvatar({user,size=36}) { return <Avatar sx={{bgcolor:user.color,width:size,height:size,fontSize:size*0.4,fontWeight:700}}>{user.initials}</Avatar>; }

    // ============================================================
    // CONTEXT
    // ============================================================
    const AppCtx = createContext();
    function useApp() { return useContext(AppCtx); }

    function useRouter() {
      const [hash, setHash] = useState(window.location.hash.slice(1)||'home');
      useEffect(() => { const h=()=>setHash(window.location.hash.slice(1)||'home'); window.addEventListener('hashchange',h); return ()=>window.removeEventListener('hashchange',h); },[]);
      const navigate = useCallback(h => { window.location.hash = h; }, []);
      const back = useCallback(() => history.back(), []);
      return { route: hash, navigate, back };
    }

    // ============================================================
    // SHARED COMPONENTS
    // ============================================================
    function BackBtn({label, onClick}) {
      const {back} = useApp();
      return <Button startIcon={<MIcon name="arrow_back" sx={{fontSize:18}} />} onClick={onClick||back} sx={{color:'text.secondary',pl:0,mb:0.5,minHeight:40,justifyContent:'flex-start'}}>{label||'Volver'}</Button>;
    }

    function TimeBadge({date}) {
      const l = timeLabel(date);
      const color = l==='Hoy'?'secondary':l==='Proximo'?'primary':'default';
      return <Chip label={l} size="small" color={color} variant={l==='Pasado'?'outlined':'filled'} sx={{fontWeight:600,fontSize:'0.65rem',height:22}} />;
    }

    function EventCard({event, onTap}) {
      const catColor = CAT_COLORS[event.cat]||'#666';
      return (
        <Card sx={{mb:1.5,position:'relative',overflow:'visible',cursor:'pointer','&:active':{transform:'scale(0.98)'},transition:'transform 0.1s'}} onClick={onTap}>
          <Box sx={{position:'absolute',top:0,left:0,width:4,height:'100%',bgcolor:catColor,borderRadius:'4px 0 0 4px'}} />
          <CardContent sx={{pl:2.5}}>
            <Box sx={{display:'flex',justifyContent:'space-between',alignItems:'center',mb:1}}>
              <TimeBadge date={event.date} />
              <Box sx={{display:'flex',alignItems:'center',gap:0.5}}>
                <MIcon name={CAT_ICONS[event.cat]} sx={{fontSize:16,color:catColor}} />
                <Typography variant="caption" sx={{textTransform:'capitalize',color:'text.secondary'}}>{event.cat}</Typography>
              </Box>
            </Box>
            <Typography variant="h3" sx={{mb:1}}>{event.title}</Typography>
            <Stack spacing={0.5}>
              <Box sx={{display:'flex',alignItems:'center',gap:0.75}}><MIcon name="place" sx={{fontSize:16,color:'text.secondary'}} /><Typography variant="body2" color="text.secondary">{event.loc}</Typography></Box>
              <Box sx={{display:'flex',gap:2}}>
                <Box sx={{display:'flex',alignItems:'center',gap:0.5}}><MIcon name="event" sx={{fontSize:16,color:'text.secondary'}} /><Typography variant="body2" color="text.secondary">{fmtDate(event.date)}</Typography></Box>
                <Box sx={{display:'flex',alignItems:'center',gap:0.5}}><MIcon name="schedule" sx={{fontSize:16,color:'text.secondary'}} /><Typography variant="body2" color="text.secondary">{fmtTime(event.date)}</Typography></Box>
              </Box>
            </Stack>
            <Box sx={{display:'flex',gap:0.75,mt:1.5,flexWrap:'wrap'}}>
              <Chip icon={<MIcon name="group" sx={{fontSize:14}} />} label={event.attendees} size="small" variant="outlined" sx={{borderColor:'divider'}} />
              {event.hasCars && <Chip icon={<MIcon name="directions_car" sx={{fontSize:14}} />} label="Coches" size="small" variant="outlined" sx={{borderColor:'divider'}} />}
              {event.status==='closed' && <Chip label="Cerrado" size="small" color="warning" />}
            </Box>
          </CardContent>
        </Card>
      );
    }

    function ChatBubble({msg}) {
      return (
        <Box sx={{display:'flex',flexDirection:'column',alignItems:msg.mine?'flex-end':'flex-start',mb:1.5}}>
          {!msg.mine && <Box sx={{display:'flex',gap:0.5,mb:0.5,alignItems:'center'}}><Typography variant="caption" sx={{fontWeight:600,color:msg.user.color}}>{msg.user.username}</Typography><Typography variant="caption" color="text.secondary">{msg.time}</Typography></Box>}
          <Box sx={{maxWidth:'80%',px:1.75,py:1,borderRadius:2,bgcolor:msg.mine?'primary.main':'action.hover',color:msg.mine?'#fff':'text.primary',borderBottomRightRadius:msg.mine?4:16,borderBottomLeftRadius:msg.mine?16:4}}>
            <Typography variant="body2">{msg.text}</Typography>
          </Box>
          {msg.mine && <Typography variant="caption" color="text.secondary" sx={{mt:0.25}}>{msg.time}</Typography>}
        </Box>
      );
    }

    function SectionExpander({icon,title,badge,children,defaultOpen=false}) {
      const [open,setOpen]=useState(defaultOpen);
      return (
        <React.Fragment>
          <Box onClick={()=>setOpen(!open)} sx={{display:'flex',alignItems:'center',justifyContent:'space-between',py:1.5,cursor:'pointer',minHeight:48}}>
            <Box sx={{display:'flex',alignItems:'center',gap:1}}>
              {icon && <MIcon name={icon} sx={{fontSize:18,color:'text.secondary'}} />}
              <Typography variant="h5">{title}</Typography>
              {badge!==undefined && <Chip label={badge} size="small" variant="outlined" sx={{height:20,fontSize:'0.6rem',borderColor:'divider'}} />}
            </Box>
            <MIcon name={open?'expand_less':'expand_more'} sx={{color:'text.secondary'}} />
          </Box>
          <Collapse in={open}>{children}</Collapse>
          <Divider />
        </React.Fragment>
      );
    }

    function UserListItem({user, onClick}) {
      return (
        <ListItemButton onClick={onClick} sx={{borderRadius:2,mb:0.5,minHeight:52}}>
          <ListItemAvatar><UserAvatar user={user} /></ListItemAvatar>
          <ListItemText primary={user.username} secondary={user.name} primaryTypographyProps={{fontWeight:600,fontSize:'0.875rem'}} secondaryTypographyProps={{fontSize:'0.75rem'}} />
          {user.role==='pending' && <Chip label="Pendiente" size="small" color="warning" sx={{height:22}} />}
          {user.role==='organizer' && <Chip label="Org" size="small" color="secondary" variant="outlined" sx={{height:22}} />}
          {user.role==='admin' && <Chip label="Admin" size="small" color="primary" variant="outlined" sx={{height:22}} />}
        </ListItemButton>
      );
    }

    // ============================================================
    // SCREENS
    // ============================================================
    function HomeScreen() {
      const {role,navigate}=useApp();
      if (role==='anon') return (
        <Box sx={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',flex:1,px:4,textAlign:'center',gap:3}}>
          <Box sx={{width:120,height:120,borderRadius:'28px',background:'linear-gradient(135deg,#FF6B35,#FF8F65)',display:'flex',alignItems:'center',justifyContent:'center',boxShadow:'0 16px 48px rgba(255,107,53,0.2)'}}>
            <MIcon name="pets" sx={{fontSize:56,color:'#fff'}} />
          </Box>
          <Typography variant="h1" sx={{fontSize:'2rem !important'}}>Patas Arriba</Typography>
          <Typography variant="body1" color="text.secondary" sx={{maxWidth:260,lineHeight:1.6}}>Coordina voluntarios, organiza eventos y ayuda a los animales que mas lo necesitan</Typography>
          <Stack spacing={1.5} sx={{width:'100%',maxWidth:280,mt:1}}>
            <Button variant="contained" size="large" fullWidth onClick={()=>navigate('signup')}>Crear cuenta</Button>
            <Button variant="outlined" size="large" fullWidth onClick={()=>navigate('login')} sx={{borderColor:'divider',color:'text.primary'}}>Ya tengo cuenta</Button>
          </Stack>
        </Box>
      );
      const upcoming=EVENTS.filter(e=>!isPast(e.date));
      const past=EVENTS.filter(e=>isPast(e.date));
      return (
        <Box sx={{pb:10}}>
          <Box sx={{px:2.5,pt:3,pb:1,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <Box><Typography variant="body2" color="text.secondary">Hola, {USERS[0].name.split(' ')[0]}</Typography><Typography variant="h1">Eventos</Typography></Box>
            <IconButton onClick={()=>navigate('own-profile')}><UserAvatar user={USERS[0]} size={40} /></IconButton>
          </Box>
          <Box sx={{px:2.5}}>
            {upcoming.map(e=><EventCard key={e._id} event={e} onTap={()=>navigate('event-details')} />)}
            {past.length>0 && <Typography variant="caption" sx={{display:'block',mt:2,mb:1,fontWeight:600,textTransform:'uppercase',letterSpacing:1,color:'text.secondary'}}>Pasados</Typography>}
            {past.map(e=><EventCard key={e._id} event={e} onTap={()=>navigate('event-details')} />)}
          </Box>
        </Box>
      );
    }

    function EventDetailsScreen() {
      const {navigate,back,role}=useApp();
      const e=EVENTS[0]; const [joined,setJoined]=useState(true);
      const isOrg=role==='organizer'||role==='admin';
      return (
        <Box sx={{pb:10}}>
          <Box sx={{px:2.5,pt:1}}>
            <BackBtn label="Eventos" onClick={()=>navigate('home')} />
            <Box sx={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
              <TimeBadge date={e.date} />
              {isOrg && <Button size="small" startIcon={<MIcon name="edit" sx={{fontSize:16}} />} onClick={()=>navigate('event-edit')} sx={{color:'text.secondary'}}>Editar</Button>}
            </Box>
            <Typography variant="h1" sx={{mt:1,mb:2}}>{e.title}</Typography>
            <Card variant="outlined" sx={{mb:2,bgcolor:'action.hover',border:'none'}}>
              <CardContent>
                <Stack spacing={0.75}>
                  <Box sx={{display:'flex',alignItems:'center',gap:1}}><MIcon name={CAT_ICONS[e.cat]} sx={{fontSize:18,color:CAT_COLORS[e.cat]}} /><Typography variant="body2" sx={{fontWeight:600,textTransform:'capitalize'}}>{e.cat}</Typography></Box>
                  <Box sx={{display:'flex',alignItems:'center',gap:1}}><MIcon name="place" sx={{fontSize:18,color:'text.secondary'}} /><Typography variant="body2">{e.loc}</Typography></Box>
                  <Box sx={{display:'flex',alignItems:'center',gap:1}}><MIcon name="event" sx={{fontSize:18,color:'text.secondary'}} /><Typography variant="body2">{fmtDate(e.date)} a las {fmtTime(e.date)}</Typography></Box>
                  <Box sx={{display:'flex',alignItems:'center',gap:1}}><MIcon name="person" sx={{fontSize:18,color:'text.secondary'}} /><Typography variant="body2">Organizado por <Typography component="span" sx={{color:'secondary.main',fontWeight:600,cursor:'pointer'}} onClick={()=>navigate('user-details')}>{e.owner.username}</Typography></Typography></Box>
                  <Box sx={{display:'flex',alignItems:'center',gap:1}}><MIcon name="group" sx={{fontSize:18,color:'text.secondary'}} /><Typography variant="body2">{e.attendees} participantes</Typography></Box>
                </Stack>
              </CardContent>
            </Card>
            {isOrg && <Button variant="outlined" fullWidth startIcon={<MIcon name="tune" sx={{fontSize:18}} />} onClick={()=>navigate('event-manage')} sx={{mb:2,borderColor:'divider',color:'text.primary'}}>Gestionar participantes</Button>}
            {!joined ? <Button variant="contained" fullWidth size="large" startIcon={<MIcon name="person_add" sx={{fontSize:18}} />} onClick={()=>setJoined(true)} sx={{mb:2}}>Unete al evento!</Button>
            : <Card variant="outlined" sx={{mb:2,bgcolor:'transparent',borderColor:'success.main',borderLeft:'3px solid'}}>
                <CardContent sx={{py:1.5,'&:last-child':{pb:1.5},display:'flex',alignItems:'center',gap:1}}>
                  <MIcon name="check_circle" sx={{color:'success.main'}} /><Typography variant="body2" fontWeight={600}>Estas apuntado a este evento</Typography>
                </CardContent>
              </Card>}
            {joined && <React.Fragment>
              <SectionExpander icon="description" title="Descripcion">
                <Typography variant="body2" color="text.secondary" sx={{pb:2,lineHeight:1.7}}>{e.desc}</Typography>
              </SectionExpander>
              <SectionExpander icon="group" title="Participantes" badge={e.attendees}>
                <List dense disablePadding>{USERS.slice(0,5).map(u=><UserListItem key={u._id} user={u} onClick={()=>navigate('user-details')} />)}</List>
              </SectionExpander>
              {e.hasCars && <SectionExpander icon="directions_car" title="Coches" badge={CAR_GROUPS.length}>
                {CAR_GROUPS.map(cg=>(
                  <Card key={cg._id} variant="outlined" sx={{mb:1,bgcolor:'action.hover',border:'none',cursor:'pointer'}} onClick={()=>navigate('car-group-details')}>
                    <CardContent sx={{py:1.5,'&:last-child':{pb:1.5}}}>
                      <Box sx={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                        <Box><Typography variant="body2" fontWeight={600}>{cg.owner.username}</Typography><Typography variant="caption" color="text.secondary">{cg.brand} · {cg.color}</Typography></Box>
                        <Chip label={`${cg.seats-cg.taken} plazas`} size="small" color={cg.seats-cg.taken>0?'success':'default'} sx={{height:22}} />
                      </Box>
                    </CardContent>
                  </Card>
                ))}
                <Card variant="outlined" sx={{mb:1,bgcolor:'transparent',borderStyle:'dashed',textAlign:'center'}}>
                  <CardContent>
                    <Typography variant="body2" color="text.secondary" sx={{mb:1}}>No tienes coche asignado</Typography>
                    <Stack direction="row" spacing={1}>
                      <Button variant="contained" size="small" fullWidth onClick={()=>navigate('car-group-create')} startIcon={<MIcon name="directions_car" sx={{fontSize:16}} />} sx={{bgcolor:'action.hover',color:'text.primary','&:hover':{bgcolor:'action.selected'}}}>Mi coche</Button>
                      <Button variant="outlined" size="small" fullWidth onClick={()=>navigate('car-group-search')} startIcon={<MIcon name="search" sx={{fontSize:16}} />} sx={{borderColor:'divider',color:'text.primary'}}>Buscar</Button>
                    </Stack>
                  </CardContent>
                </Card>
              </SectionExpander>}
              <Box sx={{mt:2,mb:2}}>
                <Box sx={{display:'flex',alignItems:'center',gap:1,mb:2}}><MIcon name="chat" sx={{fontSize:18,color:'text.secondary'}} /><Typography variant="h5">Mensajes</Typography></Box>
                {MESSAGES.map(m=><ChatBubble key={m._id} msg={m} />)}
                <Box sx={{display:'flex',gap:1,mt:2}}>
                  <TextField placeholder="Escribe un mensaje..." fullWidth size="small" sx={{'& .MuiOutlinedInput-root':{borderRadius:'24px',bgcolor:'action.hover'}}} />
                  <IconButton sx={{bgcolor:'primary.main',color:'#fff',width:40,height:40,'&:hover':{bgcolor:'primary.dark'}}}><MIcon name="send" sx={{fontSize:18}} /></IconButton>
                </Box>
              </Box>
              <Divider sx={{my:2}} />

        <Card variant="outlined" sx={{mb:2,bgcolor:'action.hover',border:'none'}}><CardContent>
          <Box sx={{display:'flex',justifyContent:'space-between',alignItems:'center',py:1,borderBottom:'1px solid',borderColor:'divider'}}><Box><Typography variant="caption" color="text.secondary" sx={{textTransform:'uppercase',letterSpacing:0.5}}>Usuario</Typography><Typography variant="body2" fontWeight={500}>{u.username}</Typography></Box><MIcon name="edit" sx={{fontSize:16,color:'primary.main'}} /></Box>
          <Box sx={{display:'flex',justifyContent:'space-between',alignItems:'center',py:1,borderBottom:'1px solid',borderColor:'divider'}}><Box><Typography variant="caption" color="text.secondary" sx={{textTransform:'uppercase',letterSpacing:0.5}}>Nombre</Typography><Typography variant="body2" fontWeight={500}>{u.name}</Typography></Box><MIcon name="edit" sx={{fontSize:16,color:'primary.main'}} /></Box>
          <Box sx={{py:1,borderBottom:'1px solid',borderColor:'divider'}}><Typography variant="caption" color="text.secondary" sx={{textTransform:'uppercase',letterSpacing:0.5}}>Correo</Typography><Typography variant="body2" color="text.secondary">{u.username}@email.com</Typography></Box>
          <Box sx={{py:1}}><Typography variant="caption" color="text.secondary" sx={{textTransform:'uppercase',letterSpacing:0.5}}>Telefono</Typography><Typography variant="body2" color="text.secondary">{u.phone}</Typography></Box>
        </CardContent></Card>
        <Typography variant="caption" color="text.secondary" sx={{display:'block',mb:2}}>Para cambiar correo o telefono, contacta a un admin</Typography>
        <Card variant="outlined" sx={{mb:2,bgcolor:'action.hover',border:'none'}}><CardContent sx={{py:1.5,'&:last-child':{pb:1.5}}}><Typography variant="caption" color="text.secondary" sx={{textTransform:'uppercase',letterSpacing:0.5}}>Miembro desde</Typography><Typography variant="body2" fontWeight={500}>{u.since}</Typography></CardContent></Card>
        <Card variant="outlined" sx={{bgcolor:'action.hover',border:'none'}}><CardContent sx={{py:1,'&:last-child':{pb:1}}}>
          <Box sx={{display:'flex',alignItems:'center',justifyContent:'space-between',minHeight:44}}><Box sx={{display:'flex',alignItems:'center',gap:1}}><MIcon name="notifications" sx={{fontSize:18,color:'text.secondary'}} /><Typography variant="body2" fontWeight={600}>Notificaciones push</Typography></Box><Switch defaultChecked color="primary" /></Box>
        </CardContent></Card>
      </Box>);
    }

    function GlossaryScreen() {
      return (<Box sx={{px:2.5,pt:1,pb:4}}><BackBtn /><Typography variant="h1" sx={{mt:2,mb:3}}>Glosario</Typography>
        {GLOSSARY.map((g,i)=><Card key={i} variant="outlined" sx={{mb:1.5,bgcolor:'action.hover',border:'none'}}><CardContent sx={{py:1.5,'&:last-child':{pb:1.5}}}><Typography variant="body2" fontWeight={700} sx={{color:'primary.main',mb:0.5}}>{g.term}</Typography><Typography variant="body2" color="text.secondary" sx={{lineHeight:1.6}}>{g.def}</Typography></CardContent></Card>)}
      </Box>);
    }

    function NotFoundScreen() {
      const {navigate}=useApp();
      return (<Box sx={{display:'flex',alignItems:'center',justifyContent:'center',flex:1,textAlign:'center'}}><Box><MIcon name="search_off" sx={{fontSize:64,color:'text.secondary'}} /><Typography variant="h2" sx={{mt:2,mb:1}}>Pagina no encontrada</Typography><Button variant="contained" onClick={()=>navigate('home')} sx={{mt:2}}>Ir al inicio</Button></Box></Box>);
    }
    function ServerErrorScreen() {
      const {navigate}=useApp();
      return (<Box sx={{display:'flex',alignItems:'center',justifyContent:'center',flex:1,textAlign:'center',px:4}}><Box><MIcon name="cloud_off" sx={{fontSize:64,color:'error.main'}} /><Typography variant="h2" sx={{mt:2,mb:1}}>Error de servidor</Typography><Typography variant="body2" color="text.secondary">Intenta nuevamente. Si persiste, contacta a un admin.</Typography><Button variant="contained" onClick={()=>navigate('home')} sx={{mt:2}}>Volver</Button></Box></Box>);
    }

    // ============================================================
    // ROUTER
    // ============================================================
    function Router({route}) {
      const map = { home:HomeScreen, login:LoginScreen, signup:SignupScreen, 'password-forget':PasswordForgetScreen, 'password-reset':PasswordResetScreen, 'event-list':EventListScreen, 'event-details':EventDetailsScreen, 'event-create':EventCreateScreen, 'event-edit':EventEditScreen, 'event-manage':EventManageScreen, 'car-group-create':CarGroupCreateScreen, 'car-group-search':CarGroupSearchScreen, 'car-group-details':CarGroupDetailsScreen, 'car-group-edit':CarGroupEditScreen, 'user-list':UserListScreen, 'user-details':UserDetailsScreen, 'own-profile':OwnProfileScreen, glossary:GlossaryScreen, 'not-found':NotFoundScreen, 'server-error':ServerErrorScreen };
      const Screen = map[route] || NotFoundScreen;
      return <Screen />;
    }

    // ============================================================
    // APP
    // ============================================================
    function App() {
      const {route,navigate,back} = useRouter();
      const [role,setRole] = useState('user');
      const isOrg = role==='organizer'||role==='admin';
      const isAnon = role==='anon';

      const tabItems = isAnon ? [] : [
        {label:'Inicio',icon:'home',route:'home'},
        {label:'Eventos',icon:'event',route:'event-list'},
        ...(isOrg?[{label:'Usuarios',icon:'group',route:'user-list'}]:[]),
        {label:'Perfil',icon:'person',route:'own-profile'},
        {label:'Glosario',icon:'menu_book',route:'glossary'},
      ];
      const tabIdx = tabItems.findIndex(t => t.route===route || (route==='home' && t.route==='home'));

      const ctx = useMemo(()=>({role,navigate,back,route}),[role,route,navigate,back]);

      return (
        <ThemeProvider theme={theme}>
          <CssBaseline />
          <AppCtx.Provider value={ctx}>
            <Box sx={{display:'flex',flexDirection:'column',minHeight:'100dvh',maxWidth:430,mx:'auto',position:'relative'}}>
              {/* Role switcher */}
              <Box sx={{bgcolor:'background.paper',py:0.75,px:2,display:'flex',alignItems:'center',gap:1,overflowX:'auto',flexShrink:0,'&::-webkit-scrollbar':{display:'none'}}}>
                <Typography variant="caption" sx={{color:'text.secondary',flexShrink:0}}>Vista:</Typography>
                {['anon','user','organizer','admin'].map(r=>(
                  <Chip key={r} label={r==='anon'?'Anonimo':r[0].toUpperCase()+r.slice(1)} size="small"
                    onClick={()=>{setRole(r);if(r==='anon')navigate('home');}}
                    sx={{cursor:'pointer',fontWeight:role===r?600:400,bgcolor:role===r?'primary.main':'transparent',color:role===r?'#fff':'text.secondary',border:role===r?'none':'1px solid',borderColor:'divider','&:hover':{bgcolor:role===r?'primary.dark':'action.hover'}}}
                  />
                ))}
              </Box>

              {/* Screen */}
              <Box sx={{flex:1,overflow:'auto','&::-webkit-scrollbar':{display:'none'}}}>
                <Router route={route} />
              </Box>

              {/* FAB */}
              {isOrg && (route==='home'||route==='event-list') && (
                <Fab variant="extended" color="primary" onClick={()=>navigate('event-create')} aria-label="Crear evento"
                  sx={{position:'absolute',bottom:tabItems.length?76:20,right:16,zIndex:10,boxShadow:'0 8px 24px rgba(255,107,53,0.3)'}}>
                  <MIcon name="add" sx={{mr:0.5}} /> Crear Evento
                </Fab>
              )}

              {/* Tab Bar */}
              {tabItems.length>0 && (
                <Paper elevation={0} sx={{borderTop:'1px solid',borderColor:'divider',flexShrink:0}}>
                  <BottomNavigation value={tabIdx>=0?tabIdx:false} showLabels
                    onChange={(e,idx)=>{navigate(tabItems[idx].route);}}
                    sx={{bgcolor:'background.paper',height:64}}>
                    {tabItems.map((t,i)=>(
                      <BottomNavigationAction key={i} label={t.label} icon={<MIcon name={t.icon} />} sx={{fontSize:'0.6rem',py:1}} />
                    ))}
                  </BottomNavigation>
                </Paper>
              )}
            </Box>
          </AppCtx.Provider>
        </ThemeProvider>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
